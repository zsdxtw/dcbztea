# 淡茶半盏（dcbztea）Nginx 部署配置
# 用途：ECS / 轻量应用服务器上托管 Vite 构建产物（dist/）
# 路径约定：站点根目录 /var/www/dcbztea，dist 内容放在该目录下
#
# 使用：sudo cp deploy/nginx.conf /etc/nginx/conf.d/dcbztea.conf && sudo nginx -s reload

server {
    listen 80;
    # 替换为您的域名（未备案前可临时用服务器公网 IP 访问）
    server_name your-domain.com;

    # 站点根目录（dist/* 的存放位置）
    root /var/www/dcbztea;
    index index.html;

    # SPA 回退（关键）：本项目使用 BrowserRouter，刷新 /sales/xxx 等子路径必须回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的静态资源：长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # index.html 不缓存（发版立即生效）
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Gzip 压缩（主 bundle 约 2.3MB，gzip 后约 720KB）
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml image/svg+xml;
    gzip_vary on;

    # 可选：后续接入后端 API 时反向代理示例
    # location /api/ {
    #     proxy_pass http://127.0.0.1:8080/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }
}

